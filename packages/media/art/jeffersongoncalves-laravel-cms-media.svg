<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#27272A" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="950" cy="310" rx="410" ry="290" fill="url(#glow)"/>

  <!-- Top label -->
  <circle cx="82" cy="66" r="4" fill="#FBBF24"/>
  <text x="100" y="71" font-size="14" font-weight="500" letter-spacing="2" fill="#A1A1AA">LARAVEL PACKAGE</text>

  <!-- Title -->
  <text x="80" y="270" font-size="76" font-weight="800" letter-spacing="-2" fill="#FAFAFA">CMS Media</text>

  <!-- Tagline -->
  <text x="80" y="326" font-size="22" font-weight="600" fill="#FBBF24">Media library integration for the Laravel CMS ecosystem</text>

  <!-- Description -->
  <text x="80" y="366" font-size="18" font-weight="400" fill="#A1A1AA">Thin, config-driven wrapper around spatie/laravel-medialibrary —</text>
  <text x="80" y="390" font-size="18" font-weight="400" fill="#A1A1AA">collections, conversions, a single HasCmsMedia concern.</text>

  <!-- Right visual: stacked-cards -->
  <g transform="translate(845, 300)">
    <g transform="rotate(-10)">
      <rect x="-150" y="-95" width="300" height="190" rx="16" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    </g>
    <g transform="rotate(-5)">
      <rect x="-150" y="-95" width="300" height="190" rx="16" fill="#1C1C20" stroke="#3F3F46" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="-150" y="-95" width="300" height="190" rx="16" fill="url(#amber)"/>
      <rect x="-126" y="-70" width="84" height="64" rx="8" fill="#0A0A0B" opacity="0.55"/>
      <rect x="-34" y="-70" width="84" height="64" rx="8" fill="#0A0A0B" opacity="0.75"/>
      <rect x="58" y="-70" width="68" height="64" rx="8" fill="#0A0A0B" opacity="0.4"/>
      <rect x="-126" y="6" width="120" height="10" rx="5" fill="#0A0A0B" opacity="0.45"/>
      <rect x="-126" y="26" width="180" height="10" rx="5" fill="#0A0A0B" opacity="0.3"/>
      <rect x="-126" y="52" width="90" height="26" rx="6" fill="#0A0A0B" opacity="0.75"/>
    </g>
  </g>

  <!-- Footer pills -->
  <g font-size="14" font-weight="500">
    <rect x="80" y="545" width="92" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="126" y="565" fill="#A1A1AA" text-anchor="middle">PHP 8.2+</text>
    <rect x="180" y="545" width="132" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="246" y="565" fill="#A1A1AA" text-anchor="middle">Laravel 11–13</text>
    <rect x="320" y="545" width="80" height="30" rx="15" fill="#18181B" stroke="#FBBF24"/>
    <text x="360" y="565" fill="#FBBF24" text-anchor="middle">MEDIA</text>
    <rect x="408" y="545" width="56" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="436" y="565" fill="#A1A1AA" text-anchor="middle">MIT</text>
  </g>

  <!-- Username -->
  <text x="1120" y="595" font-size="13" font-weight="500" fill="#52525B" text-anchor="end">@jeffersongoncalves</text>
</svg>
