<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#27272A" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="950" cy="310" rx="410" ry="290" fill="url(#glow)"/>

  <!-- Top label -->
  <circle cx="84" cy="66" r="4" fill="#FBBF24"/>
  <text x="102" y="71" font-size="14" font-weight="500" letter-spacing="2" fill="#A1A1AA">LARAVEL CMS · MONOREPO</text>

  <!-- Title + tagline + description -->
  <text x="80" y="282" font-size="72" font-weight="800" letter-spacing="-2" fill="#FAFAFA">laravel-cms</text>
  <text x="80" y="338" font-size="22" font-weight="600" fill="#FBBF24">Content management for Laravel</text>
  <text x="80" y="384" font-size="18" font-weight="400" fill="#A1A1AA">Pages, posts, categories, tags, comments &amp; revisions —</text>
  <text x="80" y="410" font-size="18" font-weight="400" fill="#A1A1AA">SEO, i18n and sitemap generation. Backend-only, no bloat.</text>

  <!-- Right visual: stacked-cards -->
  <g transform="translate(905 300)">
    <g transform="rotate(-10)">
      <rect x="-150" y="-130" width="300" height="248" rx="18" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    </g>
    <g transform="rotate(-5)">
      <rect x="-150" y="-130" width="300" height="248" rx="18" fill="#1F1F23" stroke="#3F3F46" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="-150" y="-130" width="300" height="248" rx="18" fill="url(#amber)"/>
      <text x="-120" y="-86" font-size="15" font-weight="700" letter-spacing="1" fill="#7C2D12">LARAVEL CMS</text>
      <rect x="-120" y="-66" width="180" height="10" rx="5" fill="#7C2D12" opacity="0.55"/>
      <rect x="-120" y="-44" width="240" height="10" rx="5" fill="#7C2D12" opacity="0.35"/>
      <rect x="-120" y="-10" width="120" height="10" rx="5" fill="#451A03" opacity="0.6"/>
      <rect x="-120" y="12" width="210" height="10" rx="5" fill="#451A03" opacity="0.4"/>
      <rect x="-120" y="46" width="150" height="10" rx="5" fill="#451A03" opacity="0.6"/>
      <rect x="-120" y="68" width="200" height="10" rx="5" fill="#451A03" opacity="0.35"/>
    </g>
  </g>

  <!-- Footer pills -->
  <g font-size="14" font-weight="500">
    <rect x="80" y="545" width="92" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="126" y="565" text-anchor="middle" fill="#A1A1AA">PHP 8.2+</text>
    <rect x="180" y="545" width="128" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="244" y="565" text-anchor="middle" fill="#A1A1AA">Laravel 11–13</text>
    <rect x="316" y="545" width="116" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="374" y="565" text-anchor="middle" fill="#A1A1AA">4 packages</text>
    <rect x="440" y="545" width="56" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="468" y="565" text-anchor="middle" fill="#A1A1AA">MIT</text>
  </g>

  <text x="1120" y="595" text-anchor="end" font-size="13" font-weight="500" fill="#52525B">@jeffersongoncalves</text>
</svg>
